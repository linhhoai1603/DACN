name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR with Maven (skip tests)
        working-directory: BE/document-management-backend
        run: mvn -B clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: BE/document-management-backend/target/*.jar
          target: /home/ec2-user/app
          strip_components: 3

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: ENV_FILE_CONTENT
          script: |
            cd /home/ec2-user/app

            # Tạo file .env từ Secret
            printf "%s\n" "$ENV_FILE_CONTENT" > .env

            # Dùng sed để dọn dẹp file .env nếu có ký tự lạ của Windows (\r)
            sed -i 's/\r$//' .env

            # Kill app cũ
            sudo fuser -k 8080/tcp || true

            # LẤY GIÁ TRỊ TRỰC TIẾP TỪ .env VÀ CHẠY
            # Cách này ép Java phải nhận biến ngay khi khởi động
            export $(cat .env | xargs)
            nohup java -jar *.jar > app.log 2>&1 &