name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR with Maven (skip tests)
        working-directory: BE/document-management-backend
        run: mvn -B clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: BE/document-management-backend/target/*.jar
          target: /home/ec2-user/app
          strip_components: 3

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app

            # Create .env from GitHub Secret content
            cat > .env << 'EOF'
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF

            # Stop process currently listening on port 8080 (if any)
            PID=""
            if command -v lsof >/dev/null 2>&1; then
              PID=$(lsof -ti:8080 || true)
            else
              PID=$(ss -ltnp '( sport = :8080 )' 2>/dev/null | awk -F'pid=' 'NR>1 {print $2}' | awk -F',' '{print $1}' | head -n1)
            fi
            if [ -n "$PID" ]; then
              kill -9 $PID
              echo "Killed process on port 8080: $PID"
            else
              echo "No process is listening on port 8080"
            fi

            # Start application in background
            nohup java -jar *.jar > app.log 2>&1 &
            echo "Application started. Check logs with: tail -f /home/ec2-user/app/app.log"
