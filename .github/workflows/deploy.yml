name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR with Maven (skip tests)
        working-directory: BE/document-management-backend
        run: mvn -B clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: BE/document-management-backend/target/*.jar
          target: /home/ec2-user/app
          strip_components: 3

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: ENV_FILE_CONTENT
          script: |
            set -e
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app

            # 1. Tạo file .env
            printf "%s\n" "$ENV_FILE_CONTENT" > .env
            chmod 600 .env

            # 2. Kill process cũ trên port 8080
            # Dùng sudo lsof để đảm bảo tìm thấy process của các user khác nếu có
            PID=$(sudo lsof -ti:8080 || true)
            if [ -n "$PID" ]; then
              sudo kill -9 $PID
              echo "Killed process on port 8080: $PID"
            fi

            # 3. Tìm file JAR mới nhất
            JAR_FILE=$(ls -t *.jar 2>/dev/null | head -n1)
            if [ -z "$JAR_FILE" ]; then
              echo "Error: No .jar file found!"
              exit 1
            fi

            # 4. Chạy ứng dụng với biến môi trường
            # Nạp biến từ .env và chạy nohup
            set -a
            [ -f .env ] && . .env
            set +a
            
            nohup java -jar "$JAR_FILE" > app.log 2>&1 &
            
            echo "Deployment successful. App is running: $JAR_FILE"