spring.application.name=document-management-backend

# PostgreSQL configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Multipart
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# JWT settings (secret should be Base64 encoded and >= 256-bit)
application.security.jwt.secret-key=${JWT_SECRET_KEY:ZmFsbGJhY2stZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLXVzZS1vbmx5LWNoYW5nZS1tZQ==}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ImageKit
imagekit.public_key=${IMAGEKIT_PUBLIC_KEY:}
imagekit.private_key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.url_endpoint=${IMAGEKIT_URL_ENDPOINT:}